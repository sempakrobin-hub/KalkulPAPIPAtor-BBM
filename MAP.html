<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Scan LongLat</title>
  <!-- Library Tesseract.js untuk OCR Gambar -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .card-body {
      padding: 0 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #388bfd;
      color: #f0f6fc;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .input-field::placeholder {
      color: #8b949e;
    }

    .btn-primary {
      background-color: #1f6feb;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background-color: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary.green {
      color: #3fb950;
    }

    .btn-secondary.yellow {
      color: #d29922;
    }

    .status-msg {
      font-size: 12px;
      color: #f85149;
      text-align: center;
      font-style: italic;
      min-height: 18px;
    }

    .footer-bar {
      background-color: #f0b90b;
      color: #000000;
      text-align: center;
      padding: 12px;
      font-weight: 900;
      letter-spacing: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="card-title">
        📡 AUTO SCAN LONGLAT AWAL
      </div>
      <button class="btn-toggle">Sembunyikan ▲</button>
    </div>

    <div class="card-body">
      <div class="input-group">
        <input 
          type="text" 
          id="longLatInput" 
          class="input-field" 
          placeholder="Paste link G-Maps / Teks LongLat..."
        >
        <button class="btn-primary" id="btnScan">Scan Teks</button>
      </div>

      <div class="btn-group">
        <button class="btn-secondary green" id="btnClipboard">
          📋 Auto Scan Clipboard
        </button>
        <button class="btn-secondary yellow" id="btnGPS">
          📍 GPS Perangkat
        </button>
      </div>

      <div class="status-msg" id="statusText">
        ⚠️ Tempelkan (Paste) gambar langsung ke input di atas.
      </div>
    </div>

    <div class="footer-bar">
      P A P I P A
    </div>
  </div>

  <script>
    const longLatInput = document.getElementById('longLatInput');
    const statusText = document.getElementById('statusText');
    const btnClipboard = document.getElementById('btnClipboard');

    // 1. Event listener saat user melakukan PASTE (Ctrl+V) pada input
    longLatInput.addEventListener('paste', async (event) => {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      let imageFile = null;

      for (const item of items) {
        if (item.type.includes('image')) {
          imageFile = item.getAsFile();
          break;
        }
      }

      if (imageFile) {
        event.preventDefault(); // Mencegah penempelan teks mentah jika ada
        processImage(imageFile);
      }
    });

    // 2. Tombol "Auto Scan Clipboard" untuk membaca gambar langsung dari clipboard
    btnClipboard.addEventListener('click', async () => {
      try {
        const clipboardItems = await navigator.clipboard.read();
        let imageFile = null;

        for (const item of clipboardItems) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            imageFile = await item.getType(imageType);
            break;
          }
        }

        if (imageFile) {
          processImage(imageFile);
        } else {
          statusText.innerText = '⚠️ Clipboard tidak berisi gambar.';
        }
      } catch (err) {
        statusText.innerText = '⚠️ Izinkan akses clipboard atau gunakan Ctrl+V.';
      }
    });

    // 3. Fungsi Utama: Proses Crop Kanan Bawah & Scan OCR
    async function processImage(file) {
      statusText.innerText = '⏳ Memproses scan OCR gambar...';
      longLatInput.value = 'Scanning...';

      try {
        const extractedText = await scanBottomRightImage(file);

        if (extractedText) {
          // UBAH SEMUA TITIK UNTUK DIPERBAIKI MENJADI KOMA
          const formattedText = extractedText.replace(/\./g, ',');
          
          // Masukkan ke input utama
          longLatInput.value = formattedText;
          statusText.innerText = '✅ Koordinat berhasil diekstrak dan diformat!';
        } else {
          longLatInput.value = '';
          statusText.innerText = '⚠️ Koordinat tidak terdeteksi di kanan bawah gambar.';
        }
      } catch (error) {
        console.error(error);
        longLatInput.value = '';
        statusText.innerText = '❌ Gagal memproses gambar.';
      }
    }

    // 4. Crop Gambar di Area Kanan Bawah & Jalankan Tesseract
    function scanBottomRightImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // Area Potong: 50% kanan & 35% bawah
          const cropX = img.width * 0.5;
          const cropY = img.height * 0.65;
          const cropWidth = img.width * 0.5;
          const cropHeight = img.height * 0.35;

          canvas.width = cropWidth;
          canvas.height = cropHeight;

          // Menggambar potongannya ke canvas
          ctx.drawImage(
            img,
            cropX, cropY, cropWidth, cropHeight,
            0, 0, cropWidth, cropHeight
          );

          try {
            // Jalankan Tesseract pada hasil potong canvas
            const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
            
            // Regex mencari pola angka koordinat (contoh: -7.1234, 110.1234 atau sejenisnya)
            const coordPattern = /(-?\d+[\.,]\d+[\s,]+-?\d+[\.,]\d+)/;
            const match = text.match(coordPattern);

            if (match) {
              resolve(match[0].trim());
            } else {
              // Jika regex tidak pas, ambil baris teks paling bawah
              const lines = text.trim().split('\n').filter(l => l.trim() !== '');
              resolve(lines.length > 0 ? lines[lines.length - 1] : null);
            }
          } catch (err) {
            reject(err);
          }
        };

        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
