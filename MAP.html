<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>OCR Ekstrak LongLat dari Gambar</title>
  <!-- Library Tesseract.js untuk membaca teks dari gambar (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .drop-zone { border: 2px dashed #007bff; padding: 30px; border-radius: 8px; background: #eef5ff; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
    .drop-zone:hover { background: #dcebfe; }
    .result-box { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-weight: bold; text-align: left; border: 1px solid #e0e0e0; }
    .raw-text { font-size: 12px; color: #666; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; max-height: 100px; overflow-y: auto; }
    img { max-width: 100%; max-height: 250px; margin-top: 15px; border-radius: 6px; display: none; }
    .success { color: #28a745; font-size: 18px; }
    .loading { color: #007bff; font-weight: bold; }
    a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>📍 Auto Scan LongLat dari Gambar</h2>
  <p style="color: #666; font-size: 14px;">Paste (Ctrl+V) screenshot/gambar yang memuat teks koordinat di sini</p>
  
  <div class="drop-zone" id="dropZone">
    <p id="dropText">Klik di sini, upload, atau langsung tekan <b>Ctrl + V</b> (Paste Gambar)</p>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <img id="imagePreview" alt="Preview Gambar">
  
  <div id="result" class="result-box">
    Status: Menunggu gambar dipaste...
  </div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const resultDiv = document.getElementById('result');
  const imgPreview = document.getElementById('imagePreview');

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  // Event Listener Paste (Ctrl + V)
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData.items;
    for (let item of items) {
      if (item.type.indexOf('image') !== -1) {
        handleFile(item.getAsFile());
        break;
      }
    }
  });

  function handleFile(file) {
    if (!file) return;

    // Tampilkan preview gambar
    const reader = new FileReader();
    reader.onload = function(e) {
      imgPreview.src = e.target.result;
      imgPreview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    resultDiv.innerHTML = `<span class="loading">⏳ Membaca teks pada gambar (OCR)... Mohon tunggu.</span>`;

    // Jalankan OCR menggunakan Tesseract.js
    Tesseract.recognize(
      file,
      'eng', // Bahasa Inggris (bagus untuk angka & simbol koordinat)
      { logger: m => console.log(m) }
    ).then(({ data: { text } }) => {
      console.log("Teks Terdeteksi:\n", text);
      parseCoordinates(text);
    }).catch(err => {
      resultDiv.innerHTML = `<span style="color:red;">❌ Gagal membaca gambar: ${err.message}</span>`;
    });
  }

  function parseCoordinates(rawText) {
    // Regex 1: Mencari format angka desimal berpasangan seperti "1.4526, 124.8148" atau "-6.175392, 106.827153"
    const coordRegex = /(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/;
    
    // Regex 2: Mencari format spesifik dengan kata Lat/Long (contoh: "Lat: -6.123 Long: 106.123")
    const latRegex = /(?:lat|latitude|latitud)\s*[:=]?\s*(-?\d{1,2}\.\d{3,})/i;
    const longRegex = /(?:long|lon|longitude)\s*[:=]?\s*(-?\d{1,3}\.\d{3,})/i;

    let latitude = null;
    let longitude = null;

    const matchCoord = rawText.match(coordRegex);
    const matchLat = rawText.match(latRegex);
    const matchLong = rawText.match(longRegex);

    if (matchLat && matchLong) {
      latitude = matchLat[1];
      longitude = matchLong[1];
    } else if (matchCoord) {
      latitude = matchCoord[1];
      longitude = matchCoord[2];
    }

    if (latitude && longitude) {
      const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
      resultDiv.innerHTML = `
        <div class="success">✅ Koordinat Berhasil Ditemukan!</div><br>
        <p><b>Latitude:</b> ${latitude}</p>
        <p><b>Longitude:</b> ${longitude}</p>
        <p><b>Format LongLat:</b> <span style="background:#eef5ff; padding: 2px 6px; border-radius:4px;">${latitude}, ${longitude}</span></p>
        <p><a href="${mapsUrl}" target="_blank">📍 Buka di Google Maps</a></p>
        <div class="raw-text"><b>Teks Asli Hasil Scan:</b><br>${rawText}</div>
      `;
    } else {
      resultDiv.innerHTML = `
        <span style="color:red;">⚠️ Tidak dapat menemukan pola koordinat LongLat pada gambar.</span><br>
        <small>Pastikan gambar memuat teks angka koordinat desimal (contoh: 1.4526, 124.8148 atau -6.1234, 106.5678).</small>
        <div class="raw-text"><b>Teks Terbaca dari Gambar:</b><br>${rawText || "(Tidak ada teks terbaca)"}</div>
      `;
    }
  }
</script>

</body>
</html>
