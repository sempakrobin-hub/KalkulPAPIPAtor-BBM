<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Scan LongLat Pojok Kanan Bawah</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; background-color: #f4f6f8; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .drop-zone { border: 2px dashed #007bff; padding: 25px; border-radius: 8px; background: #eef5ff; cursor: pointer; margin-bottom: 20px; }
    .preview-flex { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
    .preview-box { flex: 1; min-width: 200px; text-align: center; }
    .preview-box img, .preview-box canvas { max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid #ccc; }
    .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-weight: bold; text-align: left; border: 1px solid #ddd; }
    .raw-text { font-size: 12px; color: #555; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; }
    .badge { background: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>📍 Auto Scan LongLat (Pojok Kanan Bawah)</h2>
  <p style="color: #666; font-size: 14px;">Paste (<b>Ctrl + V</b>) gambar timestamp/watermark di sini</p>
  
  <div class="drop-zone" id="dropZone">
    <p>Klik di sini, upload, atau langsung tekan <b>Ctrl + V</b> (Paste Gambar)</p>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <!-- Area Preview Gambar Asli & Hasil Crop -->
  <div class="preview-flex">
    <div class="preview-box">
      <small>Gambar Asli</small><br>
      <img id="imagePreview" alt="Preview Asli" style="display:none;">
    </div>
    <div class="preview-box">
      <small>Area Dican <span class="badge">Pojok Kanan Bawah</span></small><br>
      <canvas id="croppedCanvas" style="display:none;"></canvas>
    </div>
  </div>
  
  <div id="result" class="result-box">
    Status: Menunggu gambar dipaste...
  </div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const resultDiv = document.getElementById('result');
  const imgPreview = document.getElementById('imagePreview');
  const croppedCanvas = document.getElementById('croppedCanvas');

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  window.addEventListener('paste', (e) => {
    const items = e.clipboardData.items;
    for (let item of items) {
      if (item.type.indexOf('image') !== -1) {
        handleFile(item.getAsFile());
        break;
      }
    }
  });

  function handleFile(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // 1. Tampilkan Gambar Asli
        imgPreview.src = e.target.result;
        imgPreview.style.display = 'block';

        // 2. CROP KHUSUS POJOK KANAN BAWAH (35% tinggi & 55% lebar dari pojok kanan bawah)
        const ctx = croppedCanvas.getContext('2d');
        const cropWidth = img.width * 0.55;   // Mengambil 55% area dari kanan
        const cropHeight = img.height * 0.35; // Mengambil 35% area dari bawah
        const startX = img.width - cropWidth;
        const startY = img.height - cropHeight;

        croppedCanvas.width = cropWidth;
        croppedCanvas.height = cropHeight;

        // Draw potongan gambar ke canvas
        ctx.drawImage(img, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
        croppedCanvas.style.display = 'block';

        // 3. Jalankan OCR hanya pada potongan canvas tersebut
        resultDiv.innerHTML = `⏳ Membaca teks di pojok kanan bawah...`;

        Tesseract.recognize(croppedCanvas, 'eng')
          .then(({ data: { text } }) => {
            parseCoordinates(text);
          })
          .catch(err => {
            resultDiv.innerHTML = `<span style="color:red;">❌ Gagal scan: ${err.message}</span>`;
          });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function parseCoordinates(rawText) {
    // Regex khusus mencocokkan format koordinat seperti: -3.9207067, 119.787384
    const coordRegex = /(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/;

    // Bersihkan karakter yang sering salah dibaca OCR (seperti huruf O jadi angka 0 atau sebaliknya)
    let cleanedText = rawText.replace(/O/g, '0').replace(/o/g, '0');

    const match = cleanedText.match(coordRegex) || rawText.match(coordRegex);

    if (match) {
      const latitude = match[1];
      const longitude = match[2];
      const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;

      resultDiv.innerHTML = `
        <div style="color:#28a745; font-size:18px;">✅ LongLat Berhasil Ditemukan!</div><br>
        <p><b>Latitude:</b> ${latitude}</p>
        <p><b>Longitude:</b> ${longitude}</p>
        <p><b>Format LongLat:</b> <span style="background:#eef5ff; padding: 4px 8px; border-radius:4px; font-size:16px;">${latitude}, ${longitude}</span></p>
        <p><a href="${mapsUrl}" target="_blank">📍 Buka di Google Maps</a></p>
        <div class="raw-text"><b>Teks Terbaca dari Area Crop:</b><br>${rawText}</div>
      `;
    } else {
      resultDiv.innerHTML = `
        <span style="color:red;">⚠️ Tidak dapat mendeteksi angka koordinat pada pojok kanan bawah.</span>
        <div class="raw-text"><b>Teks Terbaca:</b><br>${rawText || "(Kosong)"}</div>
      `;
    }
  }
</script>

</body>
</html>
