<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Log BBM & System Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (XLSX) library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Custom Scrollbar for Dark Theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="bg-[#0b0c10] text-gray-200 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Header Navigation -->
    <header class="bg-[#13161c] border-b border-gray-800 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl">⛽</span>
            <h1 class="text-sm md:text-base font-bold text-white tracking-wide">SYSTEM MONITORING LOG BBM</h1>
        </div>
        <div class="flex items-center space-x-2 text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-emerald-400 font-medium">Database Connected</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-3 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-4">

        <!-- LEFT PANEL: TABLE / DATA LOG MONITORING (Cols 3) -->
        <section class="lg:col-span-3 bg-[#13161c] border border-gray-800 rounded-lg p-4 flex flex-col shadow-lg">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 pb-3 border-b border-gray-800">
                <h2 class="text-xs font-bold text-gray-300 uppercase tracking-wider flex items-center gap-2">
                    <span>📋 Riwayat Log Transaksi</span>
                </h2>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="text" id="input_search_log" placeholder="Cari Plat / Requestor / Status..." 
                           class="bg-[#0b0c10] border border-gray-700 text-xs text-white rounded px-3 py-1.5 focus:outline-none focus:border-blue-500 w-full sm:w-64">
                    <button onclick="loadLogTableData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="flex-1 overflow-x-auto min-h-[400px]">
                <table class="w-full text-left text-[11px] border-collapse">
                    <thead>
                        <tr class="bg-[#1a1d24] text-gray-400 border-b border-gray-800 uppercase tracking-wider">
                            <th class="p-2.5">Waktu</th>
                            <th class="p-2.5">Plat Nomor</th>
                            <th class="p-2.5">Requestor</th>
                            <th class="p-2.5">Status Vol</th>
                            <th class="p-2.5">Status GPS</th>
                            <th class="p-2.5">Status Mafia</th>
                        </tr>
                    </thead>
                    <tbody id="tbody_log_data" class="divide-y divide-gray-800/50 text-gray-300">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">Memuat data log...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- RIGHT PANEL: CONTROLS & EXPORT (Col 1) -->
        <section class="flex flex-col space-y-4">

            <!-- PANEL TARIK DATA LOG (EXCEL - 4 TOMBOL SELEKSI) -->
            <div class="bg-[#13161c] border border-gray-800 rounded-lg p-3 flex flex-col space-y-2 shadow-lg">
                <div class="text-[11px] font-bold tracking-wider text-[#34c759] uppercase border-b border-gray-800 pb-1 flex items-center gap-1">
                    <span>📊 Tarik Data Log (Excel)</span>
                </div>
                <div class="grid grid-cols-1 gap-2 text-[10px] font-bold">
                    <!-- 1. All Log -->
                    <button onclick="downloadAllLog(this)" class="bg-[#2d323f] hover:bg-gray-700 border border-gray-600 text-white py-2.5 px-3 rounded flex items-center justify-between transition">
                        <span id="txt_btn_1">1. Download All Log</span>
                        <span class="text-xs">📥</span>
                    </button>
                    <!-- 2. Mafia -->
                    <button onclick="downloadMafiaLog(this)" class="bg-[#7f1d1d]/40 hover:bg-[#7f1d1d]/80 border border-red-500/50 text-red-300 py-2.5 px-3 rounded flex items-center justify-between transition">
                        <span id="txt_btn_2">2. Download Plat Mafia</span>
                        <span class="text-xs">🚨</span>
                    </button>
                    <!-- 3. Kurang 3 dari 5 -->
                    <button onclick="downloadKurang3of5Log(this)" class="bg-amber-950/40 hover:bg-amber-900/60 border border-amber-500/50 text-amber-300 py-2.5 px-3 rounded flex items-center justify-between transition text-left">
                        <span id="txt_btn_3">3. Data Plat (3+ status KURANG di 5 rekues terakhir)</span>
                        <span class="text-xs">⚠️</span>
                    </button>
                    <!-- 4. Data Status GPS (3 Kolom Format) -->
                    <button onclick="downloadCustomStatusGpsLog(this)" class="bg-cyan-950/40 hover:bg-cyan-900/60 border border-cyan-500/50 text-cyan-300 py-2.5 px-3 rounded flex items-center justify-between transition text-left">
                        <span id="txt_btn_4">4. Download Data Status GPS (Requestor, Plat, Status)</span>
                        <span class="text-xs">📍</span>
                    </button>
                </div>
            </div>

            <!-- PANEL UPDATE REQUESTOR MASSAL -->
            <div class="bg-[#13161c] border border-gray-800 rounded-lg p-3 flex flex-col space-y-2 shadow-lg">
                <div class="text-[11px] font-bold tracking-wider text-[#0a84ff] uppercase border-b border-gray-800 pb-1 flex items-center justify-between">
                    <span>👤 Update Requestor Massal (Excel)</span>
                    <button onclick="downloadTemplateRequestor()" class="text-[9px] text-blue-400 hover:underline">Unduh Template</button>
                </div>
                <div class="flex flex-col gap-1.5 text-[10px]">
                    <input type="file" id="excel_req_uploader" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelRequestorUpload(this)">
                    <button onclick="document.getElementById('excel_req_uploader').click()" class="bg-[#0a84ff]/20 hover:bg-[#0a84ff]/30 border border-blue-500/50 text-blue-300 py-2 px-3 rounded font-bold flex items-center justify-between transition">
                        <span id="txt_btn_gen_req">📂 Upload Excel Requestor & Update Massal</span>
                        <span class="text-xs">👥</span>
                    </button>
                </div>
            </div>

        </section>
    </main>

    <!-- SCRIPT APPLICATION LOGIC -->
    <script>
        // Config Supabase Database
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
        
        let _supabase;
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLogTableData();
        });

        // ---------------------------------------------------------
        // LOAD LOG TABLE
        // ---------------------------------------------------------
        async function loadLogTableData() {
            const tbody = document.getElementById("tbody_log_data");
            if (!_supabase) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-400">Database Supabase belum dikonfigurasi.</td></tr>`;
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('log_bbm')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">Belum ada data log transaksi.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr class="hover:bg-[#1f242d] transition">
                        <td class="p-2.5 text-gray-400">${item.created_at ? new Date(item.created_at).toLocaleString('id-ID') : '-'}</td>
                        <td class="p-2.5 font-bold text-white">${item.plat_nomor || '-'}</td>
                        <td class="p-2.5">${item.nama_requestor || '-'}</td>
                        <td class="p-2.5">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                (item.status_vol || '').includes('KURANG') ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'
                            }">
                                ${item.status_vol || 'AMAN'}
                            </span>
                        </td>
                        <td class="p-2.5">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                (item.status_gps || '').includes('AKTIF') ? 'bg-blue-950 text-blue-400 border border-blue-800' : 'bg-gray-800 text-gray-400'
                            }">
                                ${item.status_gps || 'MATI'}
                            </span>
                        </td>
                        <td class="p-2.5">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                (item.status_mafia || '').toLowerCase().includes('mafia') ? 'bg-red-950 text-red-400 border border-red-800 animate-pulse' : 'bg-gray-900 text-gray-400'
                            }">
                                ${item.status_mafia || 'NORMAL'}
                            </span>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-400">Gagal memuat log: ${err.message}</td></tr>`;
            }
        }

        // Helper File Export Excel
        function exportToExcelFile(dataArray, fileName, sheetName = "Sheet1") {
            if (typeof XLSX === "undefined") {
                alert("Library XLSX (SheetJS) belum terinstal/termuat!");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(dataArray);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
            XLSX.writeFile(workbook, fileName);
        }

        // =========================================================
        // LOGIC EXPORT (4 TOMBOL)
        // =========================================================

        // 1. All Log
        async function downloadAllLog(btn) {
            const txtEl = document.getElementById("txt_btn_1");
            btn.disabled = true;
            try {
                txtEl.innerText = "Mengambil All Log...";
                let allRows = [], pageSize = 1000, page = 0, hasMore = true;

                while (hasMore) {
                    let from = page * pageSize;
                    let to = from + pageSize - 1;
                    const { data, error } = await _supabase
                        .from('log_bbm')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .range(from, to);

                    if (error) throw error;
                    if (data && data.length > 0) {
                        allRows = allRows.concat(data);
                        txtEl.innerText = `Mengambil... (${allRows.length} data)`;
                        if (data.length < pageSize) hasMore = false;
                        else page++;
                    } else {
                        hasMore = false;
                    }
                }

                if (allRows.length === 0) return alert("Tidak ada data log.");
                exportToExcelFile(allRows, `All_Log_${new Date().toISOString().slice(0,10)}.xlsx`, "All Log");
            } catch (err) {
                alert("Gagal mengunduh All Log: " + err.message);
            } finally {
                btn.disabled = false;
                txtEl.innerText = "1. Download All Log";
            }
        }

        // 2. Download Plat Mafia
        async function downloadMafiaLog(btn) {
            const txtEl = document.getElementById("txt_btn_2");
            btn.disabled = true;
            try {
                txtEl.innerText = "Mengambil Data Mafia...";
                const { data, error } = await _supabase
                    .from('log_bbm')
                    .select('*')
                    .ilike('status_mafia', '%mafia%')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!data || data.length === 0) return alert("Tidak ada data dengan status Mafia.");
                
                exportToExcelFile(data, `Log_Mafia_${new Date().toISOString().slice(0,10)}.xlsx`, "Mafia");
            } catch (err) {
                alert("Gagal mengunduh Data Mafia: " + err.message);
            } finally {
                btn.disabled = false;
                txtEl.innerText = "2. Download Plat Mafia";
            }
        }

        // 3. Download Plat (3+ Status KURANG dari 5 Rekues Terakhir)
        async function downloadKurang3of5Log(btn) {
            const txtEl = document.getElementById("txt_btn_3");
            btn.disabled = true;
            try {
                txtEl.innerText = "Analisis Status KURANG...";
                const { data: logs, error } = await _supabase
                    .from('log_bbm')
                    .select('plat_nomor, status_vol, created_at')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!logs || logs.length === 0) return alert("Tidak ada data log untuk dianalisis.");

                const groupedByPlat = {};
                logs.forEach(row => {
                    if (!row.plat_nomor) return;
                    const plat = row.plat_nomor.trim().toUpperCase();
                    if (!groupedByPlat[plat]) groupedByPlat[plat] = [];
                    groupedByPlat[plat].push(row);
                });

                const filteredPlats = [];
                Object.keys(groupedByPlat).forEach(plat => {
                    const last5 = groupedByPlat[plat].slice(0, 5);
                    const kurangCount = last5.filter(r => (r.status_vol || '').toUpperCase().includes('KURANG')).length;

                    if (kurangCount >= 3) {
                        filteredPlats.push({
                            "Plat Nomor": plat,
                            "Jumlah Rekues Terakhir Diperiksa": last5.length,
                            "Total Status KURANG (Max 5 Terakhir)": kurangCount,
                            "Tanggal Rekues Terakhir": last5[0]?.created_at || "-"
                        });
                    }
                });

                if (filteredPlats.length === 0) return alert("Tidak ada plat dengan status KURANG >= 3 dalam 5 rekues terakhir.");
                exportToExcelFile(filteredPlats, `Data_Plat_Kurang_3_dari_5_${new Date().toISOString().slice(0,10)}.xlsx`, "Kurang 3 of 5");
            } catch (err) {
                alert("Gagal memproses data: " + err.message);
            } finally {
                btn.disabled = false;
                txtEl.innerText = "3. Data Plat (3+ status KURANG di 5 rekues terakhir)";
            }
        }

        // 4. Download Custom Status GPS (Kolom Khusus: Nama Requestor, Plat Nomor, Status GPS)
        async function downloadCustomStatusGpsLog(btn) {
            const txtEl = document.getElementById("txt_btn_4");
            btn.disabled = true;
            try {
                txtEl.innerText = "Mengambil Master Data GPS...";
                let allGpsRows = [], pageSize = 1000, page = 0, hasMore = true;

                while (hasMore) {
                    let from = page * pageSize;
                    let to = from + pageSize - 1;
                    const { data: gpsData, error: errGps } = await _supabase
                        .from('plat_gps_status')
                        .select('plat_nomor, status_gps')
                        .order('plat_nomor', { ascending: true })
                        .range(from, to);

                    if (errGps) throw errGps;
                    if (gpsData && gpsData.length > 0) {
                        allGpsRows = allGpsRows.concat(gpsData);
                        txtEl.innerText = `Mengambil... (${allGpsRows.length} data GPS)`;
                        if (gpsData.length < pageSize) hasMore = false;
                        else page++;
                    } else {
                        hasMore = false;
                    }
                }

                if (allGpsRows.length === 0) return alert("Tidak ada data GPS di database.");

                txtEl.innerText = "Mencocokkan Requestor...";
                const { data: reqData } = await _supabase
                    .from('plat_requestor')
                    .select('plat_nomor, nama_requestor');

                const requestorMap = new Map();
                if (reqData) {
                    reqData.forEach(r => {
                        if (r.plat_nomor) {
                            requestorMap.set(r.plat_nomor.trim().toUpperCase(), r.nama_requestor);
                        }
                    });
                }

                txtEl.innerText = "Membuat File Excel...";
                const formattedData = allGpsRows.map((item, index) => {
                    const platClean = item.plat_nomor ? item.plat_nomor.trim().toUpperCase() : "-";
                    return {
                        "No": index + 1,
                        "Nama Requestor": requestorMap.get(platClean) || "-",
                        "Plat Nomor": platClean,
                        "Status GPS": item.status_gps || "MATI"
                    };
                });

                exportToExcelFile(formattedData, `Data_Status_GPS_${new Date().toISOString().slice(0,10)}.xlsx`, "Status GPS");
            } catch (err) {
                alert("Gagal mengunduh Data Status GPS: " + err.message);
            } finally {
                btn.disabled = false;
                txtEl.innerText = "4. Download Data Status GPS (Requestor, Plat, Status)";
            }
        }

        // Dummy/Template Function Requestor Upload
        function downloadTemplateRequestor() {
            const template = [{"Plat Nomor": "B1234XYZ", "Nama Requestor": "John Doe"}];
            exportToExcelFile(template, "Template_Update_Requestor.xlsx", "Template");
        }

        function handleExcelRequestorUpload(input) {
            if (!input.files || input.files.length === 0) return;
            alert("Fitur upload excel requestor siap memproses file: " + input.files[0].name);
        }
    </script>
</body>
</html>
