<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Map Route</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h2 {
            color: #333;
        }
        #map_container {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 15px;
        }
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h2>Visualisasi Rute Peta</h2>
    <p>Peta di bawah ini menampilkan rute perjalanan berdasarkan koordinat awal dan tujuan.</p>

    <!-- Kontainer Peta -->
    <div id="map_container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi Peta
        var map = L.map('map_container').setView([-6.9175, 107.6191], 13); // Default ke Bandung

        // Tambahkan Tile Layer (Peta Dasar OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let currentRouteLayer = null;

        /**
         * Fungsi untuk menghasilkan rute peta
         * @param {string|number} startLat - Latitude Titik Asal
         * @param {string|number} startLng - Longitude Titik Asal
         * @param {string|number} endLat - Latitude Titik Tujuan
         * @param {string|number} endLng - Longitude Titik Tujuan
         */
        function generateMapRoute(startLat, startLng, endLat, endLng) {
            // Konversi ke string, lalu ganti koma dengan titik (jika ada format desimal koma)
            const sLat = parseFloat(String(startLat).replace(',', '.'));
            const sLng = parseFloat(String(startLng).replace(',', '.'));
            const eLat = parseFloat(String(endLat).replace(',', '.'));
            const eLng = parseFloat(String(endLng).replace(',', '.'));

            // Validasi koordinat
            if (isNaN(sLat) || isNaN(sLng) || isNaN(eLat) || isNaN(eLng)) {
                console.error("Koordinat tidak valid:", { startLat, startLng, endLat, endLng });
                alert("Koordinat awal atau tujuan tidak valid.");
                return;
            }

            // Hapus rute/marker lama jika ada
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            const startCoords = [sLat, sLng];
            const endCoords = [eLat, eLng];

            // Buat Ikon Kustom untuk Mobil (Awal)
            const carIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div style="background-color: #2b7a78; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;">🚗</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            // Buat Ikon Kustom untuk Tower/Tujuan (Akhir)
            const towerIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div style="background-color: #e25822; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;">🗼</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            // Buat LayerGroup untuk menampung marker dan polyline
            currentRouteLayer = L.layerGroup().addTo(map);

            // Tambahkan Marker ke LayerGroup
            L.marker(startCoords, { icon: carIcon }).addTo(currentRouteLayer).bindPopup("<b>Titik Awal (Mobil)</b>");
            L.marker(endCoords, { icon: towerIcon }).addTo(currentRouteLayer).bindPopup("<b>Titik Tujuan (Tower)</b>");

            // Ambil rute dari OSRM API (Open Source Routing Machine)
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${sLng},${sLat};${eLng},${eLat}?overview=full&geometries=geojson`;

            fetch(osrmUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                        // Ambil koordinat jalur rute dari OSRM [lng, lat] dibalik jadi [lat, lng]
                        const routeCoordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);

                        // Gambar garis rute jalan
                        const routePolyline = L.polyline(routeCoordinates, {
                            color: '#3388ff',
                            weight: 5,
                            opacity: 0.75
                        });
                        
                        currentRouteLayer.addLayer(routePolyline);

                        // Sesuaikan tampilan peta (zoom/pan) agar mencakup seluruh rute
                        map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
                    } else {
                        fallbackToStraightLine(startCoords, endCoords);
                    }
                })
                .catch(error => {
                    console.warn("Gagal mengambil rute OSRM, menggunakan fallback garis lurus.", error);
                    fallbackToStraightLine(startCoords, endCoords);
                });
        }

        // Fungsi Cadangan (Fallback) jika OSRM Gagal: Menggambar Garis Lurus
        function fallbackToStraightLine(start, end) {
            const straightLine = L.polyline([start, end], {
                color: '#e25822',
                weight: 4,
                dashArray: '5, 10',
                opacity: 0.7
            });
            
            currentRouteLayer.addLayer(straightLine);
            map.fitBounds(straightLine.getBounds(), { padding: [50, 50] });
        }

        // --- Contoh Penggunaan (Bisa Anda panggil dari skrip lain) ---
        // Contoh: Titik Awal (Monas Jakarta) ke Titik Tujuan (Gedung Sate Bandung)
        window.onload = function() {
            generateMapRoute(-6.1754, 106.8272, -6.9025, 107.6187);
        };
    </script>
</body>
</html>
