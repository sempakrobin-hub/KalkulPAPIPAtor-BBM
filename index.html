<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BBM Cloud Pro - GPS 3 Status & Requestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Library SheetJS untuk Export & Import Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: #14161d;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
        }
        .dot {
            transition: all 0.3s ease-in-out;
        }
        input:checked ~ .dot {
            transform: translateX(100%);
            background-color: #ffffff;
        }
        #toggle_mafia:checked ~ .block {
            background-color: #ff3b30;
        }
        #toggle_approval:checked ~ .block {
            background-color: #34c759;
        }
        /* Tambahan CSS untuk Zoom & Center Map Preview */
        .zoom-container {
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
        }
        .zoom-container img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- CONTAINER UTAMA DUAL PANE -->
    <div class="w-full max-w-5xl flex flex-col lg:flex-row gap-6 items-start justify-center">
        
        <!-- PANEL KIRI: FORM UTAMA -->
        <div id="main_card" class="w-full lg:w-[420px] bg-[#1e222b] border border-gray-700 shadow-2xl rounded-xl overflow-hidden flex flex-col transition-all duration-300 flex-shrink-0">
            <!-- (Bagian Form Kiri Tetap Sama) -->
            <div class="p-4 flex flex-col space-y-3.5 flex-1">
                <!-- ... Form elements ... -->
            </div>
            <div class="bg-[#f3c623] text-black font-black text-xs tracking-[0.4em] py-3 w-full text-center select-none uppercase border-t border-gray-700">
                P A P I P A
            </div>
        </div>

        <!-- PANEL KANAN: PREVIEW MAP, HISTORI & EXPORT -->
        <div class="flex-1 w-full bg-[#1e222b] border border-gray-700 shadow-2xl rounded-xl p-4 flex flex-col space-y-3 lg:max-w-md">
            
            <div class="flex justify-between items-center border-b border-gray-700 pb-1.5">
                <h3 class="text-xs font-bold tracking-wider text-[#0a84ff] uppercase">🗺️ Visual & Preview Map Tracker</h3>
                <span id="counter_foto" class="text-[10px] bg-[#2d323f] px-2 py-0.5 rounded text-gray-400">0 / 3 Foto</span>
            </div>

            <!-- SLOT CONTAINER FOTO PREVIEW DENGAN ZOOM & SCROLL CENTER -->
            <div class="grid grid-cols-3 gap-2 w-full">
                <!-- Slot 1 -->
                <div id="slot_border_1" class="relative group bg-[#13161c] border-2 border-dashed border-gray-700 rounded-lg h-24 flex flex-col items-center justify-center hover:z-30 transition-all duration-100 zoom-container" onwheel="handleMapScroll(event, this)" onclick="toggleZoomMap(this)">
                    <img id="prev_img_1" class="hidden">
                    <div id="placeholder_1" class="absolute text-center p-1 text-gray-500 pointer-events-none">
                        <span class="text-lg block">📸</span>
                        <p class="text-[8px] mt-0.5 tracking-tighter">Utama</p>
                    </div>
                    <button onclick="event.stopPropagation(); hapusFoto(1)" id="btn_del_1" class="hidden absolute top-1 right-1 bg-black/80 text-red-500 hover:text-red-400 rounded-full w-4 h-4 flex items-center justify-center font-bold text-[10px] z-40">&times;</button>
                </div>
                <!-- Slot 2 -->
                <div id="slot_border_2" class="relative group bg-[#13161c] border-2 border-dashed border-gray-700 rounded-lg h-24 flex flex-col items-center justify-center hover:z-30 transition-all duration-100 zoom-container" onwheel="handleMapScroll(event, this)" onclick="toggleZoomMap(this)">
                    <img id="prev_img_2" class="hidden">
                    <div id="placeholder_2" class="absolute text-center p-1 text-gray-500 pointer-events-none">
                        <span class="text-lg block">📸</span>
                        <p class="text-[8px] mt-0.5 tracking-tighter">Rute</p>
                    </div>
                    <button onclick="event.stopPropagation(); hapusFoto(2)" id="btn_del_2" class="hidden absolute top-1 right-1 bg-black/80 text-red-500 hover:text-red-400 rounded-full w-4 h-4 flex items-center justify-center font-bold text-[10px] z-40">&times;</button>
                </div>
                <!-- Slot 3 -->
                <div id="slot_border_3" class="relative group bg-[#13161c] border-2 border-dashed border-gray-700 rounded-lg h-24 flex flex-col items-center justify-center hover:z-30 transition-all duration-100 zoom-container" onwheel="handleMapScroll(event, this)" onclick="toggleZoomMap(this)">
                    <img id="prev_img_3" class="hidden">
                    <div id="placeholder_3" class="absolute text-center p-1 text-gray-500 pointer-events-none">
                        <span class="text-lg block">📸</span>
                        <p class="text-[8px] mt-0.5 tracking-tighter">SPBU</p>
                    </div>
                    <button onclick="event.stopPropagation(); hapusFoto(3)" id="btn_del_3" class="hidden absolute top-1 right-1 bg-black/80 text-red-500 hover:text-red-400 rounded-full w-4 h-4 flex items-center justify-center font-bold text-[10px] z-40">&times;</button>
                </div>
            </div>

            <!-- TOMBOL AKSI ATTACHMENT COMPACT -->
            <div class="bg-[#13161c] p-2 rounded-lg border border-gray-800">
                <div class="flex flex-col sm:flex-row gap-1.5">
                    <input type="file" id="file_uploader" accept="image/*" multiple class="hidden" onchange="handleFileSelect(this)">
                    <button onclick="document.getElementById('file_uploader').click()" class="flex-1 bg-[#2d323f] border border-gray-600 text-white text-[10px] font-bold py-1.5 px-2 rounded hover:bg-gray-700 transition flex items-center justify-center gap-1">
                        📂 Pilih File Foto Map
                    </button>
                    <button onclick="clearAllPhotos()" class="bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] font-bold py-1.5 px-2 rounded hover:bg-red-500/20 transition">
                        Reset
                    </button>
                </div>
            </div>

            <!-- (Sisa Panel Kanan Tetap Sama) -->
        </div>

    </div>

    <script>
        // --- SCRIPT TAMBAHAN UNTUK INTERAKSI ZOOM & SCROLL CENTER ---
        function handleMapScroll(event, container) {
            const img = container.querySelector('img');
            if (img.classList.contains('hidden')) return;
            
            event.preventDefault();
            
            // Ambil scale saat ini atau set default 1
            let currentScale = parseFloat(img.dataset.scale || '1');
            
            if (event.deltaY < 0) {
                currentScale += 0.2; // Zoom in
            } else {
                currentScale -= 0.2; // Zoom out
            }
            
            // Batasi rentang zoom (minimum 1, maksimum 4)
            if (currentScale < 1) currentScale = 1;
            if (currentScale > 4) currentScale = 4;
            
            img.dataset.scale = currentScale;
            img.style.transform = `scale(${currentScale})`;
        }

        function toggleZoomMap(container) {
            const img = container.querySelector('img');
            if (img.classList.contains('hidden')) return;
            
            let currentScale = parseFloat(img.dataset.scale || '1');
            // Jika diklik normal dan belum di-zoom, langsung zoom ke 2.5x di tengah, jika sudah kembali ke 1
            if (currentScale === 1) {
                currentScale = 2.5;
                container.style.position = 'absolute';
                container.style.zIndex = '50';
                container.style.width = '250px';
                container.style.height = '250px';
            } else {
                currentScale = 1;
                container.style.position = 'relative';
                container.style.zIndex = '1';
                container.style.width = '';
                container.style.height = '24rem'; // Sesuaikan tinggi awal
            }
            
            img.dataset.scale = currentScale;
            img.style.transform = `scale(${currentScale})`;
        }

        // (Fungsi-fungsi JavaScript bawaan lainnya seperti renderFotoSlot, cekPlat, dll tetap diletakkan di sini)
    </script>
</body>
</html>
